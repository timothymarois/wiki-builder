# The wiki this tool keeps about itself: written with it, built by it, and held to its own checks.

[site]
name = "wiki-builder"
tagline = "the tool's own wiki"

# No [budget]: these pages run on the defaults, and nobody has measured them against a reader yet.

[[section]]
title = "Start"
pages = ["index", "brief", "goals"]

[[section]]
title = "Guides"
pages = ["installation", "continuous-integration", "deployment-github", "deployment-cloudflare"]

[[section]]
title = "Writing"
pages = ["pages", "skill"]

[[section]]
title = "Reading"
pages = ["site", "serving"]

[[section]]
title = "Checking"
pages = ["checks"]

[[section]]
