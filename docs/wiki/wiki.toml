# The wiki this tool keeps about itself: written with it, built by it, and held to its own checks.

[site]
name = "Wiki Builder"
tagline = "the tool's own wiki"
url = "https://wiki-builder.marois.dev"
github = "https://github.com/timothymarois/wiki-builder"

# No [budget]: these pages run on the defaults, and nobody has measured them against a reader yet.

[[section]]
title = "Start"
pages = ["index", "brief", "goals", "health"]

[[section]]
title = "Guides"
pages = ["installation", "continuous-integration"]

[[section]]
title = "Deployment"
pages = ["deployment-github", "deployment-cloudflare"]

[[section]]
title = "Writing"
pages = ["pages"]

[[section]]
title = "Reading"
pages = ["site", "serving"]

[[section]]
title = "Checking"
pages = ["checks"]

[[section]]
title = "Reference"
pages = ["commands", "wiki-toml", "front-matter", "pictures-toml"]

[[section]]
title = "Agents"
pages = ["skill"]

[[section]]
title = "Agent prompts"
pages = ["installation-prompt", "review-prompt", "organization-prompt"]

# The tool's own source, which `wiki coverage` counts. The bundled Mermaid files are another project's.
[coverage]
include = ["src/**/*.py", "src/builder/assets/*", "src/skill/**/*.md", "action.yml", ".github/workflows/*.yml",
           "pyproject.toml"]
exclude = ["src/builder/assets/mermaid-*"]

# Written by `wiki sync`. Which release of the tool these pages
# were written against; `wiki check` says so when they differ.
[tool]
version = "0.8.0"
