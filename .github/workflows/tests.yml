name: tests

# The tool's own tests. They prove what a project gets, so they run against the installed package rather
# than the source tree.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor pyproject.toml declares, and the newest release the tests have been run on.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet .
      - run: python -m unittest discover -s tests -t tests
