name: pages

# Publishes this repository's wiki to https://wiki-builder.marois.dev, and only once it passes its checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing an older one to the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs wiki-builder and checks the wiki. Nothing below runs if the check fails.
      - uses: ./
      - run: wiki publish _site
      - run: echo "wiki-builder.marois.dev" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://wiki-builder.marois.dev
    steps:
      - uses: actions/deploy-pages@v4
